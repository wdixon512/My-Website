# Regression suite against a successful Vercel deployment (Preview or Production).
# See docs/REGRESSION.md.
name: Regression

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (e.g. https://www.will-dixon.com)"
        required: true
        type: string

concurrency:
  group: regression-${{ github.event.deployment_status.environment || inputs.base_url || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        env:
          BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:regression

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
